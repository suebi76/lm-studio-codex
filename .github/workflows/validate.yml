name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protocol and session regression tests
        run: node --test tests/*.test.js

      - name: Unix installation and global symlink test
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/unix-install.sh

      - name: Windows PowerShell 5.1 startup checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-smoke.ps1

      - name: Parse PowerShell files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) {
              foreach ($error in $parseErrors) {
                $errors += "$($_.FullName): $($error.Message)"
              }
            }
          }
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Check gateway JavaScript syntax
        run: node --check install/lib/lmstudio-responses-gateway.js

      - name: Check shell script syntax
        shell: bash
        run: |
          bash -n install/install.sh
          bash -n install/uninstall.sh
          find install/bin-unix -type f -print0 | xargs -0 -n1 bash -n
          find install/bin-unix install/lib -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Check required package files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            "install/install.ps1",
            "install/install.bat",
            "install/install.sh",
            "install/uninstall.sh",
            "install/bin/lm-studio.ps1",
            "install/bin/lm-studio.cmd",
            "install/bin/lm-studio-doctor.ps1",
            "install/bin/lm-studio-doctor.cmd",
            "install/bin-unix/lm-studio",
            "install/bin-unix/lm-studio-doctor",
            "install/lib/common.ps1",
            "install/lib/common.sh",
            "install/lib/doctor.ps1",
            "install/lib/doctor.sh",
            "install/lib/lmstudio-responses-gateway.js",
            "install/lib/web-mcp.js",
            "install/lib/run-codex.js",
            "install/templates/config.toml"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              Write-Error "Missing required file: $path"
              exit 1
            }
          }
