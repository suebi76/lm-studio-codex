name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What workflow should become easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant LM Studio, Codex CLI, or Windows details.
    validations:
      required: false
