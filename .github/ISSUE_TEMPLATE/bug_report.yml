name: Bug report
description: Report a problem with LM Studio Codex
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove private paths, tokens, and sensitive project details before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: lm-studio prints ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of lm-studio-status and relevant error text.
      render: text
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: false
  - type: input
    id: lmstudio
    attributes:
      label: LM Studio version
      placeholder: 0.x.x
    validations:
      required: false
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: codex-cli x.y.z
    validations:
      required: false
